<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(to right, black, red);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
    }

    .container {
      display: flex;
      gap: 40px;
      align-items: center;
      justify-content: center;
      width: 90%;
      max-width: 1100px;
    }

    .Main {
      text-align: center;
      width: 100%;
      max-width: 400px;
    }

    h1 {
      font-size: 42px;
      color: white;
      margin-bottom: 30px;
    }

    input {
      width: 100%;
      height: 50px;
      margin-bottom: 20px;
      background: rgba(0, 0, 0, 0.5);
      border: none;
      font-size: large;
      color: white;
      padding-left: 20px;
      border-radius: 8px;
    }

    ::placeholder {
      color: silver;
      font-size: medium;
    }

    button {
      width: 100%;
      height: 50px;
      background-color: red;
      color: white;
      font-size: large;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .Box img {
      width: 350px;
      height: 350px;
      border-radius: 30px;
      object-fit: cover;
    }

    /* 📱 MOBILE FIX */
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }

      h1 {
        font-size: 34px;
      }

      .Box img {
        width: 100%;
        max-width: 300px;
        height: auto;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="Main">
      <h1>Login</h1>
      <form>
        <input type="text" placeholder="Enter name">
        <input type="number" placeholder="Enter your number">
        <input type="email" placeholder="Enter your email">

        <button type="button" onclick="goToPage()">Submit</button>
      </form>
    </div>

    <div class="Box">
      <img src="netf.jpg" alt="netflix">
    </div>
  </div>

  <script>
    function goToPage() {
      window.location.href = "page2.html";
    }
  </script>

</body>
</html>
